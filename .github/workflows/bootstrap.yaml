# Bootstrap build for the mips port of Haiku (SGI Indy), the only
# architecture of this fork.
#
#   toolchain  builds the cross toolchain from the irix7 forks of binutils
#              and GCC (cached), and the stage 1 cross sysroot of irix7/muse
#   ports      one job per port: haikuporter cross-builds it
#   boot       builds the netboot image and boots it in the IRIS emulator up
#              to the mounted boot volume
#   discover   lists the ports of the HaikuPorts tree and splits them into
#              shards of about 20 ports
#   all-ports  one job per shard: builds the ports of the shard one after
#              the other, with the recipes of HaikuPorts that do not list
#              mips (HAIKUPORTER_ALL_ARCHITECTURES, see irix7/museporter).
#              A port that fails does not stop the shard. Its log is kept.
#   report     counts the built, stored and failed ports of all shards
#
# The packages of the bootstrap ports are stored in the release
# "mips-packages" of this repository. The packages of the other ports are
# stored in the releases "mips-ports-NN", ten shards each: a release holds
# at most 1000 files.
#
# The packages are stored in the release "mips-packages" of this repository.
# Each job uploads what it built as soon as it is built. A ports job whose
# package is in the release already does nothing, so a run that was cancelled
# or ran out of time continues where it stopped. A recipe change needs a new
# REVISION to be built again; "rebuild" of a manual run builds everything.
name: bootstrap
on:
  push:
    branches: [ indy-mips ]
  pull_request:
    branches: [ indy-mips ]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build every port, also those with a package in the release
        type: boolean
        default: false

# One run at a time. A newer run waits: cancelling would throw away an
# hour of toolchain build before it is cached.
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  HAIKU_TOOLCHAIN: ${{ github.workspace }}/toolchain
  HAIKU_MIPS_SEED_DIR: ${{ github.workspace }}/toolchain/seed
  CROSS_PREFIX: ${{ github.workspace }}/toolchain/cross-tools-mips/bin/mips-unknown-haiku-
  GMP_PREFIX: /usr
  MPFR_PREFIX: /usr
  MPC_PREFIX: /usr
  ISL_PREFIX: /usr
  RELEASE: mips-packages
  HOST_PACKAGES: >-
    nasm autopoint bison flex texinfo gawk gperf m4 autoconf automake libtool libtool-bin
    cmake zip unzip mtools xorriso libgmp-dev libmpfr-dev libmpc-dev
    libisl-dev zlib1g-dev libzstd-dev aspell groff

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
    - name: checkout haiku (irix7 fork, mips port)
      uses: actions/checkout@v7
      with:
        repository: irix7/muse
        ref: indy-mips
        path: haiku

    - name: checkout buildtools (for jam)
      uses: actions/checkout@v7
      with:
        repository: haiku/buildtools
        path: buildtools

    - name: checkout haikuporter (irix7 fork)
      uses: actions/checkout@v7
      with:
        repository: irix7/museporter
        ref: indy-mips
        path: toolchain/ports/haikuporter

    - name: checkout haikuports
      uses: actions/checkout@v7
      with:
        repository: haikuports/haikuports
        path: toolchain/ports/haikuports

    - name: checkout haikuports.cross
      uses: actions/checkout@v7
      with:
        path: toolchain/ports/haikuports.cross

    - name: checkout binutils (irix7 fork)
      uses: actions/checkout@v7
      with:
        repository: irix7/binutils-gdb
        ref: haiku-mips
        path: toolchain/src/binutils

    - name: checkout gcc (irix7 fork)
      uses: actions/checkout@v7
      with:
        repository: irix7/gcc
        ref: haiku-mips
        path: toolchain/src/gcc

    - name: install ubuntu packages
      run: |
        sudo apt-get update
        sudo apt-get install -y $HOST_PACKAGES

    - name: install jam
      working-directory: buildtools/jam
      run: |
        make
        sudo ./jam0 install

    # Only what the toolchain is built from: a change to port.sh must not
    # rebuild GCC.
    - name: generate cache key, based on the toolchain sources and scripts
      id: cache-key
      run: echo "key=${{ runner.os }}-mips-toolchain-$(git -C toolchain/src/gcc rev-parse HEAD)-$(git -C toolchain/src/binutils rev-parse HEAD)-${{ hashFiles('haiku/indy/toolchain/build.sh', 'haiku/indy/toolchain/seed.sh', 'haiku/indy/toolchain/syslibs.sh', 'haiku/indy/toolchain/patches/**') }}" >> "$GITHUB_OUTPUT"

    - name: Cache toolchain (${{ steps.cache-key.outputs.key }})
      id: cache-toolchain
      uses: actions/cache/restore@v6
      with:
        path: |
          toolchain/cross-tools-mips
          toolchain/seed
          toolchain/build/kernel-libs
          toolchain/build/syslibs/*.hpkg
        key: ${{ steps.cache-key.outputs.key }}

    - name: build binutils, GCC and the kernel libraries
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        (cd toolchain/src/gcc && ./contrib/gcc_update --touch) || true
        haiku/indy/toolchain/build.sh all > toolchain-build.log 2>&1

    - name: fill the seed directory
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: haiku/indy/toolchain/seed.sh

    - name: configure the regular build
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        mkdir -p haiku/generated.mips
        cd haiku/generated.mips
        ../configure --cross-tools-prefix "$CROSS_PREFIX"

    - name: build and package the shared GCC libraries
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: haiku/indy/toolchain/syslibs.sh "$PWD/haiku/generated.mips" > syslibs.log 2>&1

    - name: save the toolchain in cache (${{ steps.cache-key.outputs.key }})
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          toolchain/cross-tools-mips
          toolchain/seed
          toolchain/build/kernel-libs
          toolchain/build/syslibs/*.hpkg
        key: ${{ steps.cache-key.outputs.key }}

    - name: configure the bootstrap build
      run: |
        mkdir -p toolchain/bootstrap
        cd toolchain/bootstrap
        ../../haiku/configure --cross-tools-prefix "$CROSS_PREFIX" \
          --bootstrap ../ports/haikuporter/haikuporter \
          ../ports/haikuports.cross ../ports/haikuports
        packages=objects/haiku/mips/packaging/repositories/HaikuPortsCross-build/packages
        mkdir -p $packages
        cp ../build/syslibs/gcc_bootstrap_*.hpkg $packages/

    - name: build the stage 1 cross sysroot
      env:
        OUTPUT: ${{ github.workspace }}/toolchain/bootstrap
      run: |
        haiku/indy/jam.sh @bootstrap-raw build \
          '<repository-config-HaikuPortsCross>haikuports.conf' \
          haiku_cross_devel_sysroot_stage1_mips.hpkg

    # What a ports job needs of the bootstrap build: the host tools, the MIME
    # database, the sysroot package and haikuporter's configuration. The
    # paths in haikuports.conf are absolute and equal on every runner.
    - name: pack the bootstrap build for the ports jobs
      run: |
        repository=objects/haiku/mips/packaging/repositories/HaikuPortsCross-build
        tar -C toolchain/bootstrap -czf bootstrap-base.tar.gz \
          objects/linux objects/common \
          objects/haiku/mips/packaging/packages/haiku_cross_devel_sysroot_stage1_mips.hpkg \
          $repository/haikuports.conf $repository/packages

    - name: upload the bootstrap build
      uses: actions/upload-artifact@v7
      with:
        name: bootstrap-base
        path: bootstrap-base.tar.gz
        retention-days: 7

    - name: store the GCC and sysroot packages in the release
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # The release exists: the workflow token got HTTP 403 when it tried
        # to create it, so it was created by hand.
        gh release upload "$RELEASE" --clobber \
          toolchain/build/syslibs/*.hpkg \
          toolchain/bootstrap/objects/haiku/mips/packaging/packages/haiku_cross_devel_sysroot_stage1_mips.hpkg

    - name: show the end of the logs
      if: always()
      run: |
        for log in toolchain-build.log syslibs.log haiku/generated.mips/jam.log \
            toolchain/bootstrap/jam.log; do
          if [ -f $log ]; then
            echo "::group::$log"
            tail -150 $log
            echo "::endgroup::"
          fi
        done

    - name: write errors.txt
      if: failure()
      run: |
        for log in toolchain-build.log syslibs.log haiku/generated.mips/jam.log \
            toolchain/bootstrap/jam.log; do
          if [ -f $log ]; then
            echo "== $log"
            grep -n -m 12 -B3 'error:\| Error [0-9]\|\*\*\* \|undefined reference\|\.\.\.failed' $log | cut -c1-300
            echo "-- end of $log"
            tail -30 $log | cut -c1-300
          fi
        done > errors.txt
        { echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: upload the logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: toolchain-logs
        if-no-files-found: ignore
        path: |
          errors.txt
          *.log
          toolchain/bootstrap/jam.log
          haiku/generated.mips/jam.log

  ports:
    needs: [toolchain, discover]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGES: toolchain/bootstrap/objects/haiku/mips/packaging/repositories/HaikuPortsCross-build/packages
    strategy:
      fail-fast: false
      matrix:
        # The packages of build/jam/repositories/HaikuPortsCross/mips in
        # irix7/muse, without the GCC packages of the toolchain job.
        port:
          - ca_root_certificates
          - haikuporter
          - noto
          - zlib_bootstrap
          - expat_bootstrap
          - libffi_bootstrap
          - ncurses6_bootstrap
          - m4_bootstrap
          - make_bootstrap
          - sed_bootstrap
          - grep_bootstrap
          - less_bootstrap
          - gawk_bootstrap
          - findutils_bootstrap
          - coreutils_bootstrap
          - flex_bootstrap
          - bison_bootstrap
          - bash_bootstrap
          - texinfo_bootstrap
          - freetype_bootstrap
          - curl_bootstrap
          - icu74_bootstrap
          - python3.10_bootstrap
          - binutils_bootstrap

    steps:
    - name: checkout haikuports.cross
      uses: actions/checkout@v7
      with:
        path: toolchain/ports/haikuports.cross

    # The package name holds the version of the newest recipe and its
    # REVISION. With that package in the release there is nothing to do.
    - name: get the list of stored packages
      uses: actions/download-artifact@v8
      with:
        name: stored-list
        path: stored-list

    - name: look for the package of ${{ matrix.port }} in the release
      id: stored
      run: |
        cp stored-list/assets.txt assets.txt
        port=${{ matrix.port }}
        recipe=$(ls toolchain/ports/haikuports.cross/*/*/"$port"-*.recipe | sort -V | tail -1)
        version=${recipe##*/"$port"-}
        version=${version%.recipe}
        revision=$(sed -n 's/^REVISION="\(.*\)"/\1/p' "$recipe")
        skip=false
        if [ "${{ inputs.rebuild }}" != "true" ] \
            && grep -q "^$port-$version-$revision-\(mips\|any\)\.hpkg$" assets.txt; then
          skip=true
        fi
        echo "$port $version-$revision: stored=$skip"
        echo "skip=$skip" >> "$GITHUB_OUTPUT"

    - name: checkout haiku (irix7 fork, mips port)
      if: steps.stored.outputs.skip != 'true'
      uses: actions/checkout@v7
      with:
        repository: irix7/muse
        ref: indy-mips
        path: haiku

    - name: checkout haikuporter (irix7 fork)
      if: steps.stored.outputs.skip != 'true'
      uses: actions/checkout@v7
      with:
        repository: irix7/museporter
        ref: indy-mips
        path: toolchain/ports/haikuporter

    - name: install ubuntu packages
      if: steps.stored.outputs.skip != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y $HOST_PACKAGES

    - name: restore the toolchain
      if: steps.stored.outputs.skip != 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          toolchain/cross-tools-mips
          toolchain/seed
          toolchain/build/kernel-libs
          toolchain/build/syslibs/*.hpkg
        key: ${{ needs.toolchain.outputs.cache-key }}
        fail-on-cache-miss: true

    - name: download the bootstrap build
      if: steps.stored.outputs.skip != 'true'
      uses: actions/download-artifact@v8
      with:
        name: bootstrap-base

    - name: unpack the bootstrap build
      if: steps.stored.outputs.skip != 'true'
      run: |
        mkdir -p toolchain/bootstrap
        tar -C toolchain/bootstrap -xzf bootstrap-base.tar.gz

    # Packages that are built already serve as dependencies.
    - name: download the stored packages
      if: steps.stored.outputs.skip != 'true'
      run: |
        mkdir -p "$PACKAGES"
        cp -r stored-list/stored stored
        if [ "${{ inputs.rebuild }}" = "true" ]; then
          rm -f stored/${{ matrix.port }}-*.hpkg
        fi
        cp -n stored/*.hpkg "$PACKAGES/" 2>/dev/null || true
        ls "$PACKAGES" | sort > before.txt

    - name: build ${{ matrix.port }}
      if: steps.stored.outputs.skip != 'true'
      run: haiku/indy/toolchain/port.sh ${{ matrix.port }} > port.log 2>&1

    # Also after a failed build: the dependencies it built are kept.
    - name: store the new packages in the release
      if: always() && steps.stored.outputs.skip != 'true' && github.event_name != 'pull_request'
      run: |
        [ -f before.txt ] || exit 0
        ls "$PACKAGES" | sort > after.txt
        new=$(comm -13 before.txt after.txt | grep -v -- '-source\.hpkg$' || true)
        echo "new packages: $new"
        # Two jobs can build the same package: one as its port, one as a
        # dependency. The first upload wins. Replacing the asset (--clobber)
        # from both at once fails with HTTP 404 and can lose the asset.
        stored() {
          gh release view "$RELEASE" --json assets -q '.assets[].name' | grep -qx "$1"
        }
        for package in $new; do
          case "$package" in
            ${{ matrix.port }}-*|${{ matrix.port }}_*)
              if [ "${{ inputs.rebuild }}" = "true" ]; then
                gh release upload "$RELEASE" --clobber "$PACKAGES/$package"
                continue
              fi
              ;;
          esac
          stored "$package" && continue
          gh release upload "$RELEASE" "$PACKAGES/$package" \
            || { sleep 20; stored "$package"; } \
            || gh release upload "$RELEASE" "$PACKAGES/$package"
        done

    # errors.txt is what indy/ci-failures.sh of irix7/muse prints.
    - name: write errors.txt
      if: failure()
      run: |
        haiku/indy/toolchain/port-errors.sh port.log > errors.txt || true
        { echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        cat errors.txt

    - name: upload the log
      if: always() && steps.stored.outputs.skip != 'true'
      uses: actions/upload-artifact@v7
      with:
        name: port-${{ matrix.port }}
        if-no-files-found: ignore
        path: |
          errors.txt
          port.log

  boot:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    - name: checkout haiku (irix7 fork, mips port)
      uses: actions/checkout@v7
      with:
        repository: irix7/muse
        ref: indy-mips
        path: haiku

    - name: checkout buildtools (for jam)
      uses: actions/checkout@v7
      with:
        repository: haiku/buildtools
        path: buildtools

    - name: install ubuntu packages
      run: |
        sudo apt-get update
        sudo apt-get install -y $HOST_PACKAGES

    - name: install jam
      working-directory: buildtools/jam
      run: |
        make
        sudo ./jam0 install

    - name: restore the toolchain
      uses: actions/cache/restore@v6
      with:
        path: |
          toolchain/cross-tools-mips
          toolchain/seed
          toolchain/build/kernel-libs
          toolchain/build/syslibs/*.hpkg
        key: ${{ needs.toolchain.outputs.cache-key }}
        fail-on-cache-miss: true

    - name: configure the regular build
      run: |
        mkdir -p haiku/generated.mips
        cd haiku/generated.mips
        ../configure --cross-tools-prefix "$CROSS_PREFIX"

    - name: build the netboot image and bfs_shell
      run: haiku/indy/jam.sh haiku-netboot-indy '<build>bfs_shell'

    - name: create an empty BFS volume
      working-directory: haiku/generated.mips
      run: |
        truncate -s 64M disk.raw
        LD_LIBRARY_PATH=$(dirname $(find objects/linux -name libroot_build.so | head -1)) \
          objects/linux/x86_64/release/tools/bfs_shell/bfs_shell \
          --initialize disk.raw Haiku

    - name: install IRIS
      id: iris
      uses: irix7/iris/.github/actions/setup-iris@main

    - name: boot in IRIS up to the mounted boot volume
      env:
        IRIS: ${{ steps.iris.outputs.iris }}
        IRIS_CI: ${{ steps.iris.outputs.iris-ci }}
        WORK: ${{ runner.temp }}/gate
        DISK: haiku/generated.mips/disk.raw
        BOOT_ARGS: disk
        # 256 MB, two banks: the most the kernel uses (RAM contiguous from
        # 0x08000000). The runner has 16 GB.
        RAM: 256
      run: |
        haiku/indy/gate.sh haiku/generated.mips/haiku-indy-netboot \
          "Mounted boot partition" 300

    - name: write errors.txt
      if: failure()
      run: |
        mkdir -p boot-logs
        cp "$RUNNER_TEMP"/gate/serial.log "$RUNNER_TEMP"/gate/iris.out boot-logs/ 2>/dev/null || true
        {
          if [ -f haiku/generated.mips/jam.log ]; then
            echo "== jam.log"
            grep -n -m 12 -B3 'error:\|undefined reference\|\.\.\.failed' haiku/generated.mips/jam.log | cut -c1-300
            tail -5 haiku/generated.mips/jam.log | cut -c1-300
          fi
          if [ -f boot-logs/serial.log ]; then
            echo "== end of the serial console"
            tail -60 boot-logs/serial.log | cut -c1-300
          fi
          if [ -f boot-logs/iris.out ]; then
            echo "== end of the emulator output"
            tail -20 boot-logs/iris.out | cut -c1-300
          fi
        } > errors.txt
        { echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: collect the logs
      if: always()
      run: |
        mkdir -p boot-logs
        cp "$RUNNER_TEMP"/gate/serial.log "$RUNNER_TEMP"/gate/iris.out boot-logs/ 2>/dev/null || true
        cp haiku/generated.mips/jam.log boot-logs/ 2>/dev/null || true

    - name: upload the logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: boot
        if-no-files-found: ignore
        path: |
          errors.txt
          boot-logs

  # The ports of HaikuPorts. The recipes of the tree are the source of the
  # list, so a new recipe is built by the next run.
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      shards: ${{ steps.list.outputs.shards }}

    steps:
    - name: checkout haikuports
      uses: actions/checkout@v7
      with:
        repository: haikuports/haikuports
        path: haikuports

    - name: checkout haikuporter (irix7 fork), for the host tools it provides
      uses: actions/checkout@v7
      with:
        repository: irix7/museporter
        ref: indy-mips
        path: haikuporter

    - name: list the ports and create the releases
      id: list
      run: |
        python3 - <<'PY' > shards.json
        # The ports in the order of their dependencies: a port comes after
        # the ports that provide what it requires. Ports with the same depth
        # are ordered by the number of ports that depend on them, so the
        # libraries that most ports need come first, in shard 000. Names that
        # the host provides (cmd:make, ...) are not dependencies here.
        import os, re, sys, json, collections
        tree = 'haikuports'
        recipes = {}   # port name -> newest recipe path
        for category in sorted(os.listdir(tree)):
            path = os.path.join(tree, category)
            if '-' not in category or not os.path.isdir(path):
                continue
            for d in sorted(os.listdir(path)):
                directory = os.path.join(path, d)
                if not os.path.isdir(directory):
                    continue
                for f in sorted(os.listdir(directory)):
                    m = re.fullmatch(r'(.+)-([^-]+)\.recipe', f)
                    if m:
                        recipes[m.group(1)] = os.path.join(directory, f)
        ports = sorted(recipes)
        VAR = re.compile(r'^(PROVIDES|REQUIRES|BUILD_REQUIRES|BUILD_PREREQUIRES)(_[A-Za-z0-9_]+)?="([^"]*)"', re.M | re.S)
        def names(block):
            out = []
            for line in block.split('\n'):
                line = line.split('#')[0].strip()
                if not line:
                    continue
                tok = line.split()[0]
                tok = re.sub(r'\$\{?secondaryArchSuffix\}?', '', tok)
                tok = re.sub(r'\$\{?[A-Za-z_]+\}?', '', tok)
                if tok and tok not in ('if', 'fi', 'then', 'else'):
                    out.append(tok)
            return out
        provides = {}   # name -> port
        need = {}       # port -> set of names
        for port, path in recipes.items():
            text = open(path, errors='replace').read()
            need[port] = set()
            provides.setdefault(port, port)
            for m in VAR.finditer(text):
                kind, ex, body = m.group(1), m.group(2), m.group(3)
                for n in names(body):
                    if kind == 'PROVIDES':
                        provides.setdefault(n, port)
                    else:
                        need[port].add(n)
        import re as _re
        hostsrc = open(os.path.join('haikuporter', 'HaikuPorter/BuildPlatform.py')).read()
        a = hostsrc.index('self.implicitBuildHostProvides = set([')
        b = hostsrc.index('])', a)
        host = set(_re.findall(r"'((?:cmd:)?[A-Za-z0-9_+.:-]+)'", hostsrc[a:b])) | {'haiku', 'haiku_devel'}
        deps = {p: set() for p in ports}
        for p in ports:
            for n in need[p]:
                if n in host: continue
                q = provides.get(n)
                if q and q != p:
                    deps[p].add(q)
        # levels: longest chain of dependencies, cycles cut where they close
        level = {}
        state = {}
        sys.setrecursionlimit(100000)
        def lvl(p):
            if p in level: return level[p]
            if state.get(p) == 1: return -1
            state[p] = 1
            best = 0
            for q in sorted(deps[p]):
                l = lvl(q)
                if l >= 0: best = max(best, l + 1)
            state[p] = 2
            level[p] = best
            return best
        for p in ports: lvl(p)
        # dependents (transitive count approximated by direct + indirect via levels)
        users = collections.Counter()
        rev = collections.defaultdict(set)
        for p in ports:
            for q in deps[p]: rev[q].add(p)
        def trans(p):
            seen, stack = set(), [p]
            while stack:
                x = stack.pop()
                for y in rev[x]:
                    if y not in seen: seen.add(y); stack.append(y)
            return len(seen)
        for p in ports: users[p] = trans(p)
        order = sorted(ports, key=lambda p: (level[p], -users[p], p))
        # The tools that the image of the native build needs go into the
        # first shard, in the order of their dependencies.
        first = [p for p in ('libiconv', 'gettext', 'unzip', 'xz_utils', 'ninja')
                 if p in order]
        ports = first + [p for p in order if p not in first]
        # At most 256 jobs. At most ten shards in a release.
        size = max(15, -(-len(ports) // 250))
        shards = []
        for n, i in enumerate(range(0, len(ports), size)):
            shards.append({
                'id': '%03d' % n,
                'release': 'mips-ports-%02d' % (n // 10),
                'ports': ' '.join(ports[i:i + size]),
            })
        print(json.dumps(shards))
        PY
        echo "ports: $(jq '[.[].ports | split(" ") | length] | add' shards.json), shards: $(jq length shards.json)"
        for release in $(jq -r '.[].release' shards.json | sort -u); do
          gh release view "$release" >/dev/null 2>&1 \
            || gh release create "$release" --prerelease \
              --title "$release" \
              --notes "Packages of ports of HaikuPorts cross-built for mips by the workflow bootstrap."
        done
        echo "shards=$(jq -c . shards.json)" >> "$GITHUB_OUTPUT"

    # The token of a workflow may make about 1000 API requests an hour. The
    # jobs that follow read these two files and make no request to the
    # releases: the names of the stored packages, and the bootstrap packages.
    - name: list the stored packages
      run: |
        : > assets.txt
        for release in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^mips-ports-\|^mips-packages$'); do
          gh release view "$release" --json assets -q '.assets[].name' >> assets.txt
        done
        wc -l assets.txt

    - name: download the bootstrap packages
      run: |
        mkdir -p stored
        gh release download "$RELEASE" --pattern '*.hpkg' --dir stored || true
        rm -f stored/haiku_cross_devel_sysroot_*.hpkg stored/gcc_*.hpkg
        ls stored | wc -l

    - name: keep both for the jobs
      uses: actions/upload-artifact@v7
      with:
        name: stored-list
        path: |
          assets.txt
          stored

  all-ports:
    needs: [toolchain, discover, ports]
    if: ${{ !cancelled() && needs.toolchain.result == 'success' && needs.discover.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      PACKAGES: toolchain/bootstrap/objects/haiku/mips/packaging/repositories/HaikuPortsCross-build/packages
      HAIKUPORTER_ALL_ARCHITECTURES: 1
      HAIKUPORTER_PACKAGES_LINK: 1
      PORTER_ARGS: --debug
      TREE_PATH: ${{ github.workspace }}/toolchain/ports/haikuports
      CONFIG_SITE: ${{ github.workspace }}/haiku/indy/toolchain/config.site
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.discover.outputs.shards) }}

    steps:
    - name: checkout haikuports.cross
      uses: actions/checkout@v7
      with:
        path: toolchain/ports/haikuports.cross

    - name: checkout haikuports
      uses: actions/checkout@v7
      with:
        repository: haikuports/haikuports
        path: toolchain/ports/haikuports

    - name: checkout haiku (irix7 fork, mips port)
      uses: actions/checkout@v7
      with:
        repository: irix7/muse
        ref: indy-mips
        path: haiku

    - name: checkout haikuporter (irix7 fork)
      uses: actions/checkout@v7
      with:
        repository: irix7/museporter
        ref: indy-mips
        path: toolchain/ports/haikuporter

    - name: install ubuntu packages
      run: |
        sudo apt-get update
        sudo apt-get install -y $HOST_PACKAGES

    - name: restore the toolchain
      uses: actions/cache/restore@v6
      with:
        path: |
          toolchain/cross-tools-mips
          toolchain/seed
          toolchain/build/kernel-libs
          toolchain/build/syslibs/*.hpkg
        key: ${{ needs.toolchain.outputs.cache-key }}
        fail-on-cache-miss: true

    - name: download the bootstrap build
      uses: actions/download-artifact@v8
      with:
        name: bootstrap-base

    - name: unpack the bootstrap build
      run: |
        mkdir -p toolchain/bootstrap
        tar -C toolchain/bootstrap -xzf bootstrap-base.tar.gz

    # The bootstrap packages serve as dependencies.
    - name: get the stored packages
      uses: actions/download-artifact@v8
      with:
        name: stored-list
        path: stored-list

    - name: put the stored packages in place
      run: |
        mkdir -p "$PACKAGES" out
        cp -n stored-list/stored/*.hpkg "$PACKAGES/" 2>/dev/null || true
        ls "$PACKAGES" | sort > before.txt

    # Shard 000 holds the ports that most others depend on. Runners are limited, so
    # the later shards wait for one and start after it, usually when shard
    # 000 has finished. They take its packages as dependencies. When shard
    # 000 has not finished, there is no artifact and they build them
    # themselves.
    - name: get the packages of shard 000
      if: ${{ matrix.shard.id != '000' }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: packages-000
        path: packages-000

    - name: put the packages of shard 000 in place
      if: ${{ matrix.shard.id != '000' }}
      run: |
        cp -n packages-000/out/*.hpkg "$PACKAGES/" 2>/dev/null || true
        ls "$PACKAGES" | sort > before.txt

    # The ports of the shard, one after the other. A port with a stored
    # package is skipped. A new package is stored at once, so a job that
    # runs out of time loses only the port it was building. The next run
    # continues with the ports that have no package.
    - name: build the ports of shard ${{ matrix.shard.id }}
      run: |
        mkdir -p logs
        : > results.txt
        cp stored-list/assets.txt assets.txt
        deadline=$(( $(date +%s) + 19200 ))
        for port in ${{ matrix.shard.ports }}; do
          if [ "$(date +%s)" -gt "$deadline" ]; then
            echo "$port out-of-time" >> results.txt
            continue
          fi
          recipe=
          for candidate in $(find toolchain/ports/haikuports -name "$port-*.recipe" | sort -V); do
            rest=${candidate##*/"$port"-}
            case "${rest%.recipe}" in *-*) ;; *) recipe=$candidate ;; esac
          done
          if [ -z "$recipe" ]; then
            echo "$port failed" >> results.txt
            echo "== $port: no recipe of that name in its directory" >> errors.txt
            continue
          fi
          version=${recipe##*/"$port"-}
          version=${version%.recipe}
          revision=$(sed -n 's/^REVISION="\(.*\)"/\1/p' "$recipe")
          if grep -q "^$port-$version-$revision-\(mips\|any\)\.hpkg$" assets.txt; then
            echo "$port stored" >> results.txt
            continue
          fi
          ls "$PACKAGES" | sort > before-port.txt
          if timeout 5400 haiku/indy/toolchain/port.sh "$port" > "logs/$port.log" 2>&1; then
            echo "$port built" >> results.txt
          else
            echo "$port failed" >> results.txt
            { echo "== $port"; haiku/indy/toolchain/port-errors.sh "logs/$port.log" 6; } >> errors.txt || true
          fi
          ls "$PACKAGES" | sort > after-port.txt
          # The new packages leave with the artifact of the shard. They are
          # published to the release by the job publish.
          for package in $(comm -13 before-port.txt after-port.txt | grep -v -- '-source\.hpkg$'); do
            echo "$package" >> assets.txt
            cp "$PACKAGES/$package" out/
          done
          # A log of a port that built is not kept.
          [ "$(tail -1 results.txt | cut -d' ' -f2)" = failed ] || rm -f "logs/$port.log"
        done
        echo "${{ matrix.shard.release }}" > release.txt
        cat results.txt
        {
          echo "shard ${{ matrix.shard.id }} (${{ matrix.shard.release }}): $(grep -c ' built' results.txt) built, $(grep -c ' stored' results.txt) stored, $(grep -c ' failed' results.txt) failed, $(grep -c ' out-of-time' results.txt) not started"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: upload the results and the logs of failed ports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: result-${{ matrix.shard.id }}
        if-no-files-found: ignore
        path: |
          results.txt
          errors.txt
          logs

    - name: upload the new packages
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: packages-${{ matrix.shard.id }}
        if-no-files-found: ignore
        path: |
          out
          release.txt

  # Uploads the new packages to the releases. The token allows about 1000
  # requests an hour; at the limit the job waits for the reset. A package
  # that is not uploaded when the job ends is built again by the next run.
  publish:
    needs: all-ports
    if: ${{ !cancelled() && needs.all-ports.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: download the packages of the shards
      uses: actions/download-artifact@v8
      with:
        pattern: packages-*
        path: shards

    - name: upload the packages to the releases
      run: |
        deadline=$(( $(date +%s) + 20400 ))
        done_count=0
        for dir in shards/packages-*; do
          [ -d "$dir/out" ] || continue
          release=$(cat "$dir/release.txt")
          for file in "$dir"/out/*.hpkg; do
            [ -e "$file" ] || continue
            while true; do
              if [ "$(date +%s)" -gt "$deadline" ]; then
                echo "out of time after $done_count packages"
                exit 0
              fi
              if gh release upload "$release" "$file" 2> upload.err; then
                done_count=$((done_count + 1))
                break
              fi
              cat upload.err
              if grep -q 'already exists' upload.err; then break; fi
              # At the limit: wait for the reset.
              reset=$(gh api rate_limit --jq .resources.core.reset 2>/dev/null || echo 0)
              wait=$(( reset - $(date +%s) + 5 ))
              [ "$wait" -lt 30 ] && wait=30
              [ "$wait" -gt 3700 ] && wait=3700
              echo "waiting $wait s"
              sleep "$wait"
            done
          done
        done
        echo "published $done_count packages" | tee -a "$GITHUB_STEP_SUMMARY"

  report:
    needs: all-ports
    if: ${{ !cancelled() && needs.all-ports.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: download the results
      uses: actions/download-artifact@v8
      with:
        pattern: result-*
        path: shards

    - name: count the ports
      run: |
        cat shards/*/results.txt > all.txt 2>/dev/null || true
        {
          echo "| state | ports |"
          echo "|---|---|"
          for state in built stored failed out-of-time; do
            echo "| $state | $(grep -c " $state\$" all.txt) |"
          done
          echo
          echo "Ports that failed: see the artifacts result-NNN (errors.txt, logs/)."
        } | tee -a "$GITHUB_STEP_SUMMARY"
