# Bootstrap build for the mips port of Haiku (SGI Indy), the only
# architecture of this fork.
#
#   toolchain  builds the cross toolchain from the irix7 forks of binutils
#              and GCC (cached), and the stage 1 cross sysroot of irix7/haiku
#   ports      one job per port: haikuporter cross-builds it
#   boot       builds the netboot image and boots it in the IRIS emulator up
#              to the mounted boot volume
#
# The packages are stored in the release "mips-packages" of this repository.
# Each job uploads what it built as soon as it is built. A ports job whose
# package is in the release already does nothing, so a run that was cancelled
# or ran out of time continues where it stopped. A recipe change needs a new
# REVISION to be built again; "rebuild" of a manual run builds everything.
name: bootstrap
on:
  push:
    branches: [ indy-mips ]
  pull_request:
    branches: [ indy-mips ]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build every port, also those with a package in the release
        type: boolean
        default: false

# One run at a time. A newer run waits: cancelling would throw away an
# hour of toolchain build before it is cached.
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  HAIKU_TOOLCHAIN: ${{ github.workspace }}/toolchain
  HAIKU_MIPS_SEED_DIR: ${{ github.workspace }}/toolchain/seed
  CROSS_PREFIX: ${{ github.workspace }}/toolchain/cross-tools-mips/bin/mips-unknown-haiku-
  GMP_PREFIX: /usr
  MPFR_PREFIX: /usr
  MPC_PREFIX: /usr
  ISL_PREFIX: /usr
  RELEASE: mips-packages
  HOST_PACKAGES: >-
    nasm autopoint bison flex texinfo gawk gperf m4 autoconf automake libtool
    cmake zip unzip mtools xorriso libgmp-dev libmpfr-dev libmpc-dev
    libisl-dev zlib1g-dev libzstd-dev

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
    - name: checkout haiku (irix7 fork, mips port)
      uses: actions/checkout@v4
      with:
        repository: irix7/haiku
        ref: indy-mips
        path: haiku

    - name: checkout buildtools (for jam)
      uses: actions/checkout@v4
      with:
        repository: haiku/buildtools
        path: buildtools

    - name: checkout haikuporter (irix7 fork)
      uses: actions/checkout@v4
      with:
        repository: irix7/haikuporter
        ref: indy-mips
        path: toolchain/ports/haikuporter

    - name: checkout haikuports
      uses: actions/checkout@v4
      with:
        repository: haikuports/haikuports
        path: toolchain/ports/haikuports

    - name: checkout haikuports.cross
      uses: actions/checkout@v4
      with:
        path: toolchain/ports/haikuports.cross

    - name: checkout binutils (irix7 fork)
      uses: actions/checkout@v4
      with:
        repository: irix7/binutils-gdb
        ref: haiku-mips
        path: toolchain/src/binutils

    - name: checkout gcc (irix7 fork)
      uses: actions/checkout@v4
      with:
        repository: irix7/gcc
        ref: haiku-mips
        path: toolchain/src/gcc

    - name: install ubuntu packages
      run: |
        sudo apt-get update
        sudo apt-get install -y $HOST_PACKAGES

    - name: install jam
      working-directory: buildtools/jam
      run: |
        make
        sudo ./jam0 install

    # Only what the toolchain is built from: a change to port.sh must not
    # rebuild GCC.
    - name: generate cache key, based on the toolchain sources and scripts
      id: cache-key
      run: echo "key=${{ runner.os }}-mips-toolchain-$(git -C toolchain/src/gcc rev-parse HEAD)-$(git -C toolchain/src/binutils rev-parse HEAD)-${{ hashFiles('haiku/indy/toolchain/build.sh', 'haiku/indy/toolchain/seed.sh', 'haiku/indy/toolchain/syslibs.sh', 'haiku/indy/toolchain/patches/**') }}" >> "$GITHUB_OUTPUT"

    - name: Cache toolchain (${{ steps.cache-key.outputs.key }})
      id: cache-toolchain
      uses: actions/cache/restore@v4
      with:
        path: |
          toolchain/cross-tools-mips
          toolchain/seed
          toolchain/build/kernel-libs
          toolchain/build/syslibs/*.hpkg
        key: ${{ steps.cache-key.outputs.key }}

    - name: build binutils, GCC and the kernel libraries
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        (cd toolchain/src/gcc && ./contrib/gcc_update --touch) || true
        haiku/indy/toolchain/build.sh all > toolchain-build.log 2>&1

    - name: fill the seed directory
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: haiku/indy/toolchain/seed.sh

    - name: configure the regular build
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        mkdir -p haiku/generated.mips
        cd haiku/generated.mips
        ../configure --cross-tools-prefix "$CROSS_PREFIX"

    - name: build and package the shared GCC libraries
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: haiku/indy/toolchain/syslibs.sh "$PWD/haiku/generated.mips" > syslibs.log 2>&1

    - name: save the toolchain in cache (${{ steps.cache-key.outputs.key }})
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          toolchain/cross-tools-mips
          toolchain/seed
          toolchain/build/kernel-libs
          toolchain/build/syslibs/*.hpkg
        key: ${{ steps.cache-key.outputs.key }}

    - name: configure the bootstrap build
      run: |
        mkdir -p toolchain/bootstrap
        cd toolchain/bootstrap
        ../../haiku/configure --cross-tools-prefix "$CROSS_PREFIX" \
          --bootstrap ../ports/haikuporter/haikuporter \
          ../ports/haikuports.cross ../ports/haikuports
        packages=objects/haiku/mips/packaging/repositories/HaikuPortsCross-build/packages
        mkdir -p $packages
        cp ../build/syslibs/gcc_bootstrap_*.hpkg $packages/

    - name: build the stage 1 cross sysroot
      env:
        OUTPUT: ${{ github.workspace }}/toolchain/bootstrap
      run: |
        haiku/indy/jam.sh @bootstrap-raw build \
          '<repository-config-HaikuPortsCross>haikuports.conf' \
          haiku_cross_devel_sysroot_stage1_mips.hpkg

    # What a ports job needs of the bootstrap build: the host tools, the MIME
    # database, the sysroot package and haikuporter's configuration. The
    # paths in haikuports.conf are absolute and equal on every runner.
    - name: pack the bootstrap build for the ports jobs
      run: |
        repository=objects/haiku/mips/packaging/repositories/HaikuPortsCross-build
        tar -C toolchain/bootstrap -czf bootstrap-base.tar.gz \
          objects/linux objects/common \
          objects/haiku/mips/packaging/packages/haiku_cross_devel_sysroot_stage1_mips.hpkg \
          $repository/haikuports.conf $repository/packages

    - name: upload the bootstrap build
      uses: actions/upload-artifact@v4
      with:
        name: bootstrap-base
        path: bootstrap-base.tar.gz
        retention-days: 7

    - name: store the GCC and sysroot packages in the release
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # The release exists: the workflow token got HTTP 403 when it tried
        # to create it, so it was created by hand.
        gh release upload "$RELEASE" --clobber \
          toolchain/build/syslibs/*.hpkg \
          toolchain/bootstrap/objects/haiku/mips/packaging/packages/haiku_cross_devel_sysroot_stage1_mips.hpkg

    - name: show the end of the logs
      if: always()
      run: |
        for log in toolchain-build.log syslibs.log haiku/generated.mips/jam.log \
            toolchain/bootstrap/jam.log; do
          if [ -f $log ]; then
            echo "::group::$log"
            tail -150 $log
            echo "::endgroup::"
          fi
        done

    - name: write errors.txt
      if: failure()
      run: |
        for log in toolchain-build.log syslibs.log haiku/generated.mips/jam.log \
            toolchain/bootstrap/jam.log; do
          if [ -f $log ]; then
            echo "== $log"
            grep -n -m 12 -B3 'error:\| Error [0-9]\|\*\*\* \|undefined reference\|\.\.\.failed' $log | cut -c1-300
            echo "-- end of $log"
            tail -30 $log | cut -c1-300
          fi
        done > errors.txt
        { echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: upload the logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: toolchain-logs
        if-no-files-found: ignore
        path: |
          errors.txt
          *.log
          toolchain/bootstrap/jam.log
          haiku/generated.mips/jam.log

  ports:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGES: toolchain/bootstrap/objects/haiku/mips/packaging/repositories/HaikuPortsCross-build/packages
    strategy:
      fail-fast: false
      matrix:
        # The packages of build/jam/repositories/HaikuPortsCross/mips in
        # irix7/haiku, without the GCC packages of the toolchain job.
        port:
          - ca_root_certificates
          - haikuporter
          - noto
          - zlib_bootstrap
          - expat_bootstrap
          - libffi_bootstrap
          - ncurses6_bootstrap
          - m4_bootstrap
          - make_bootstrap
          - sed_bootstrap
          - grep_bootstrap
          - less_bootstrap
          - gawk_bootstrap
          - findutils_bootstrap
          - coreutils_bootstrap
          - flex_bootstrap
          - bison_bootstrap
          - bash_bootstrap
          - texinfo_bootstrap
          - freetype_bootstrap
          - curl_bootstrap
          - icu74_bootstrap
          - python3.10_bootstrap
          - binutils_bootstrap

    steps:
    - name: checkout haikuports.cross
      uses: actions/checkout@v4
      with:
        path: toolchain/ports/haikuports.cross

    # The package name holds the version of the newest recipe and its
    # REVISION. With that package in the release there is nothing to do.
    - name: look for the package of ${{ matrix.port }} in the release
      id: stored
      run: |
        port=${{ matrix.port }}
        recipe=$(ls toolchain/ports/haikuports.cross/*/*/"$port"-*.recipe | sort -V | tail -1)
        version=${recipe##*/"$port"-}
        version=${version%.recipe}
        revision=$(sed -n 's/^REVISION="\(.*\)"/\1/p' "$recipe")
        gh release view "$RELEASE" --json assets -q '.assets[].name' > assets.txt 2>/dev/null || true
        skip=false
        if [ "${{ inputs.rebuild }}" != "true" ] \
            && grep -q "^$port-$version-$revision-\(mips\|any\)\.hpkg$" assets.txt; then
          skip=true
        fi
        echo "$port $version-$revision: stored=$skip"
        echo "skip=$skip" >> "$GITHUB_OUTPUT"

    - name: checkout haiku (irix7 fork, mips port)
      if: steps.stored.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        repository: irix7/haiku
        ref: indy-mips
        path: haiku

    - name: checkout haikuporter (irix7 fork)
      if: steps.stored.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        repository: irix7/haikuporter
        ref: indy-mips
        path: toolchain/ports/haikuporter

    - name: install ubuntu packages
      if: steps.stored.outputs.skip != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y $HOST_PACKAGES

    - name: restore the toolchain
      if: steps.stored.outputs.skip != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          toolchain/cross-tools-mips
          toolchain/seed
          toolchain/build/kernel-libs
          toolchain/build/syslibs/*.hpkg
        key: ${{ needs.toolchain.outputs.cache-key }}
        fail-on-cache-miss: true

    - name: download the bootstrap build
      if: steps.stored.outputs.skip != 'true'
      uses: actions/download-artifact@v4
      with:
        name: bootstrap-base

    - name: unpack the bootstrap build
      if: steps.stored.outputs.skip != 'true'
      run: |
        mkdir -p toolchain/bootstrap
        tar -C toolchain/bootstrap -xzf bootstrap-base.tar.gz

    # Packages that are built already serve as dependencies.
    - name: download the stored packages
      if: steps.stored.outputs.skip != 'true'
      run: |
        mkdir -p "$PACKAGES"
        gh release download "$RELEASE" --pattern '*.hpkg' --dir stored || true
        rm -f stored/haiku_cross_devel_sysroot_*.hpkg stored/gcc_*.hpkg
        if [ "${{ inputs.rebuild }}" = "true" ]; then
          rm -f stored/${{ matrix.port }}-*.hpkg
        fi
        cp -n stored/*.hpkg "$PACKAGES/" 2>/dev/null || true
        ls "$PACKAGES" | sort > before.txt

    - name: build ${{ matrix.port }}
      if: steps.stored.outputs.skip != 'true'
      run: haiku/indy/toolchain/port.sh ${{ matrix.port }} > port.log 2>&1

    # Also after a failed build: the dependencies it built are kept.
    - name: store the new packages in the release
      if: always() && steps.stored.outputs.skip != 'true' && github.event_name != 'pull_request'
      run: |
        [ -f before.txt ] || exit 0
        ls "$PACKAGES" | sort > after.txt
        new=$(comm -13 before.txt after.txt | grep -v -- '-source\.hpkg$' || true)
        echo "new packages: $new"
        # Two jobs can build the same package: one as its port, one as a
        # dependency. The first upload wins. Replacing the asset (--clobber)
        # from both at once fails with HTTP 404 and can lose the asset.
        stored() {
          gh release view "$RELEASE" --json assets -q '.assets[].name' | grep -qx "$1"
        }
        for package in $new; do
          case "$package" in
            ${{ matrix.port }}-*|${{ matrix.port }}_*)
              if [ "${{ inputs.rebuild }}" = "true" ]; then
                gh release upload "$RELEASE" --clobber "$PACKAGES/$package"
                continue
              fi
              ;;
          esac
          stored "$package" && continue
          gh release upload "$RELEASE" "$PACKAGES/$package" \
            || { sleep 20; stored "$package"; } \
            || gh release upload "$RELEASE" "$PACKAGES/$package"
        done

    # errors.txt is what indy/ci-failures.sh of irix7/haiku prints.
    - name: write errors.txt
      if: failure()
      run: |
        haiku/indy/toolchain/port-errors.sh port.log > errors.txt || true
        { echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        cat errors.txt

    - name: upload the log
      if: always() && steps.stored.outputs.skip != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: port-${{ matrix.port }}
        if-no-files-found: ignore
        path: |
          errors.txt
          port.log

  boot:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    - name: checkout haiku (irix7 fork, mips port)
      uses: actions/checkout@v4
      with:
        repository: irix7/haiku
        ref: indy-mips
        path: haiku

    - name: checkout buildtools (for jam)
      uses: actions/checkout@v4
      with:
        repository: haiku/buildtools
        path: buildtools

    - name: install ubuntu packages
      run: |
        sudo apt-get update
        sudo apt-get install -y $HOST_PACKAGES

    - name: install jam
      working-directory: buildtools/jam
      run: |
        make
        sudo ./jam0 install

    - name: restore the toolchain
      uses: actions/cache/restore@v4
      with:
        path: |
          toolchain/cross-tools-mips
          toolchain/seed
          toolchain/build/kernel-libs
          toolchain/build/syslibs/*.hpkg
        key: ${{ needs.toolchain.outputs.cache-key }}
        fail-on-cache-miss: true

    - name: configure the regular build
      run: |
        mkdir -p haiku/generated.mips
        cd haiku/generated.mips
        ../configure --cross-tools-prefix "$CROSS_PREFIX"

    - name: build the netboot image and bfs_shell
      run: haiku/indy/jam.sh haiku-netboot-indy '<build>bfs_shell'

    - name: create an empty BFS volume
      working-directory: haiku/generated.mips
      run: |
        truncate -s 64M disk.raw
        LD_LIBRARY_PATH=$(dirname $(find objects/linux -name libroot_build.so | head -1)) \
          objects/linux/x86_64/release/tools/bfs_shell/bfs_shell \
          --initialize disk.raw Haiku

    - name: install IRIS
      id: iris
      uses: irix7/iris/.github/actions/setup-iris@main

    - name: boot in IRIS up to the mounted boot volume
      env:
        IRIS: ${{ steps.iris.outputs.iris }}
        IRIS_CI: ${{ steps.iris.outputs.iris-ci }}
        WORK: ${{ runner.temp }}/gate
        DISK: haiku/generated.mips/disk.raw
        BOOT_ARGS: disk
      run: |
        haiku/indy/gate.sh haiku/generated.mips/haiku-indy-netboot \
          "Mounted boot partition" 300

    - name: write errors.txt
      if: failure()
      run: |
        mkdir -p boot-logs
        cp "$RUNNER_TEMP"/gate/serial.log "$RUNNER_TEMP"/gate/iris.out boot-logs/ 2>/dev/null || true
        {
          if [ -f haiku/generated.mips/jam.log ]; then
            echo "== jam.log"
            grep -n -m 12 -B3 'error:\|undefined reference\|\.\.\.failed' haiku/generated.mips/jam.log | cut -c1-300
            tail -5 haiku/generated.mips/jam.log | cut -c1-300
          fi
          if [ -f boot-logs/serial.log ]; then
            echo "== end of the serial console"
            tail -60 boot-logs/serial.log | cut -c1-300
          fi
          if [ -f boot-logs/iris.out ]; then
            echo "== end of the emulator output"
            tail -20 boot-logs/iris.out | cut -c1-300
          fi
        } > errors.txt
        { echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: collect the logs
      if: always()
      run: |
        mkdir -p boot-logs
        cp "$RUNNER_TEMP"/gate/serial.log "$RUNNER_TEMP"/gate/iris.out boot-logs/ 2>/dev/null || true
        cp haiku/generated.mips/jam.log boot-logs/ 2>/dev/null || true

    - name: upload the logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: boot
        if-no-files-found: ignore
        path: |
          errors.txt
          boot-logs
